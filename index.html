<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Welcome to my portfolio. Select your preferred language."
    />
    <title>Portfolio | Select Language</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="lang-selection">
      <section class="lang-card" aria-labelledby="language-selection-title">
        <p class="eyebrow">Select your language</p>
        <h1 id="language-selection-title">Welcome to my portfolio</h1>
        <p class="lang-intro">
          Choose your preferred language / Elige tu idioma preferido
        </p>
        <div class="language-options" role="list">
          <a class="lang-option" href="en/index.html" role="listitem">
            <span class="lang-option-title">English</span>
          </a>
          <a class="lang-option" href="es/index.html" role="listitem">
            <span class="lang-option-title">Español</span>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
